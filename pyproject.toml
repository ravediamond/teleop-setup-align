[project]
name = "teleop-setup-align"
version = "0.1.0"
description = "Ghost-overlay utility to physically realign a robot arm and cameras to a saved reference setup before teleop recording."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Ravindu Somawansa", email = "ravindu.somawansa@gmail.com" }]
dependencies = [
    "lerobot",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
teleop-setup-align = "teleop_setup_align.cli:main"
teleop-setup-align-web = "teleop_setup_align.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleop_setup_align"]
